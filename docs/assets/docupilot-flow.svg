<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">DocuPilot AI document question flow</title><desc id="desc">A conceptual view of PDF upload, FastAPI processing, LangGraph retrieval and tools, local FAISS and SQLite storage, and a grounded answer in the web interface.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#141b32"/></linearGradient><linearGradient id="accent"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#36d9e8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7888b5"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#f4f6ff}.sub{font:15px system-ui,sans-serif;fill:#aab4d3}.label{font:700 17px system-ui,sans-serif;fill:#f5f7ff}.small{font:14px system-ui,sans-serif;fill:#bbc5e0}.tiny{font:12px system-ui,sans-serif;fill:#8793b4}.card{fill:#151e36;stroke:#334164;stroke-width:1.4}.line{fill:none;stroke:#7888b5;stroke-width:2;marker-end:url(#arrow)}.pill{fill:#1e2946;stroke:#3a4c78}.flow{stroke-dasharray:8 10;animation:dash 3s linear infinite}@keyframes dash{to{stroke-dashoffset:-36}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style></defs><rect width="1200" height="680" rx="28" fill="url(#bg)"/><circle cx="1040" cy="120" r="170" fill="#5b4bdb" opacity=".08"/><circle cx="160" cy="570" r="180" fill="#22c9db" opacity=".06"/><text x="64" y="72" class="h">From document to grounded answer</text><text x="64" y="102" class="sub">DocuPilot AI · conceptual application flow · integrations depend on local configuration</text><g transform="translate(58 180)"><rect width="190" height="150" rx="18" class="card"/><rect x="22" y="23" width="46" height="56" rx="8" fill="#27224a" stroke="#8b7cff"/><path d="M51 23v15h17" fill="none" stroke="#8b7cff" stroke-width="2"/><path d="M33 51h24M33 61h24" stroke="#b6abff" stroke-width="2"/><text x="84" y="48" class="label">PDF upload</text><text x="22" y="108" class="small">Web UI sends PDF</text><text x="22" y="129" class="tiny">to the API</text></g><path d="M250 255h55" class="line flow"/><g transform="translate(310 180)"><rect width="190" height="150" rx="18" class="card"/><circle cx="48" cy="49" r="24" fill="#123546" stroke="#36d9e8"/><path d="M38 49h20M48 39v20" stroke="#8ff5fa" stroke-width="3"/><text x="83" y="48" class="label">FastAPI</text><text x="22" y="108" class="small">Upload and chat</text><text x="22" y="129" class="tiny">endpoints</text></g><path d="M502 255h55" class="line flow"/><g transform="translate(562 180)"><rect width="220" height="150" rx="18" class="card"/><path d="M35 52h38M54 33v38M35 33l38 38M73 33 35 71" stroke="#a99dff" stroke-width="2" opacity=".9"/><circle cx="54" cy="52" r="29" fill="none" stroke="#8b7cff" stroke-width="2"/><text x="96" y="48" class="label">LangGraph</text><text x="22" y="108" class="small">Routes retrieval</text><text x="22" y="129" class="tiny">and configured tools</text></g><path d="M784 255h52" class="line flow"/><g transform="translate(842 164)"><rect width="300" height="184" rx="18" class="card"/><text x="22" y="35" class="label">Grounding &amp; tools</text><rect x="22" y="55" width="256" height="48" rx="12" class="pill"/><text x="38" y="76" class="small">PDF → chunks → embeddings</text><text x="38" y="94" class="tiny">FAISS retrieval (MMR)</text><rect x="22" y="116" width="256" height="48" rx="12" class="pill"/><text x="38" y="137" class="small">RAG · calculator · web search</text><text x="38" y="155" class="tiny">Optional tools may need keys</text></g><path d="M990 351v72" class="line flow"/><g transform="translate(800 438)"><rect width="342" height="106" rx="18" class="card"/><text x="22" y="37" class="label">Local persistence</text><text x="22" y="65" class="small">SQLite checkpoint · optional AWS artifact storage</text><text x="22" y="87" class="tiny">AWS requires credentials and configuration</text></g><path d="M798 485H700V365" class="line" opacity=".65"/><path d="M665 332v92H444v-92" class="line flow"/><g transform="translate(310 438)"><rect width="340" height="106" rx="18" class="card"/><text x="22" y="37" class="label">Answer returned to the UI</text><text x="22" y="65" class="small">Grounded response + source context</text><text x="22" y="87" class="tiny">UI reveals the completed response</text></g><path d="M310 489H154V352" class="line flow"/><g transform="translate(58 438)"><rect width="190" height="106" rx="18" class="card"/><text x="22" y="42" class="label">User reviews</text><text x="22" y="69" class="small">Answer + sources</text></g><rect x="58" y="600" width="1084" height="1" fill="#293654"/><text x="60" y="632" class="tiny">Architecture illustration based on repository code. Live hosted services and production readiness are not implied.</text><g filter="url(#glow)"><circle r="4" fill="#5de5f0"><animateMotion dur="3s" repeatCount="indefinite" path="M250 255h55"/></circle></g></svg>
