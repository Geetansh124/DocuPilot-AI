<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390" role="img" aria-labelledby="title desc"><title id="title">DocuPilot AI — grounded answers from your PDFs</title><desc id="desc">A document card routes through a retrieval workspace to a grounded AI response.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset=".56" stop-color="#171333"/><stop offset="1" stop-color="#101b31"/></linearGradient><linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#56d6d0"/></linearGradient><linearGradient id="card"><stop stop-color="#242243"/><stop offset="1" stop-color="#172b39"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern></defs><rect width="1440" height="390" rx="28" fill="url(#bg)"/><rect width="1440" height="390" rx="28" fill="url(#grid)"/><circle cx="1180" cy="170" r="160" fill="#8b5cf6" opacity=".12" filter="url(#glow)"/><circle cx="1260" cy="255" r="110" fill="#2dd4bf" opacity=".09" filter="url(#glow)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="78" y="76" width="168" height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/><circle cx="96" cy="91" r="4" fill="#5eead4"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="110" y="96" fill="#d7d3ff" font-size="12" font-weight="700" letter-spacing="1.6">DOCUMENT WORKSPACE</text><text x="76" y="174" fill="#fff" font-size="52" font-weight="760" letter-spacing="-2">Answers with</text><text x="76" y="232" fill="url(#accent)" font-size="52" font-weight="760" letter-spacing="-2">receipts.</text><text x="80" y="274" fill="#b7bfd2" font-size="17">Ask your PDFs. Keep the source in the conversation.</text><text x="80" y="316" fill="#aeb6ce" font-size="12" font-weight="600">PDF → CHUNKS　·　FAISS RETRIEVAL　·　LANGGRAPH TOOLS</text><g transform="translate(800 68)"><path d="M124 128C228 48 306 52 407 115M490 130C548 130 566 144 608 166" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 10" opacity=".72"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="5s" repeatCount="indefinite"/></path><g transform="translate(26 84)"><rect width="150" height="188" rx="18" fill="url(#card)" stroke="#c4b5fd" stroke-opacity=".38"/><rect x="22" y="22" width="44" height="52" rx="10" fill="#ef4444" fill-opacity=".18"/><path d="M35 34h15l9 9v21H35zM50 34v10h9" fill="none" stroke="#fca5a5" stroke-width="2"/><text x="22" y="104" fill="#f8fafc" font-size="14" font-weight="700">research.pdf</text><path d="M22 123h104M22 139h90M22 155h100" stroke="#cbd5e1" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/><text x="22" y="177" fill="#a5b4fc" font-size="10" font-weight="700" letter-spacing="1">SOURCE</text></g><g transform="translate(337 82)"><rect width="185" height="194" rx="20" fill="url(#card)" stroke="#5eead4" stroke-opacity=".55"/><circle cx="30" cy="31" r="10" fill="#5eead4" fill-opacity=".18"/><path d="M26 31h8M30 27v8" stroke="#5eead4" stroke-width="1.8"/><text x="49" y="35" fill="#d1fae5" font-size="12" font-weight="700">RETRIEVAL</text><rect x="18" y="58" width="149" height="42" rx="10" fill="#0b1020" fill-opacity=".6" stroke="#fff" stroke-opacity=".08"/><text x="30" y="76" fill="#a5b4fc" font-size="9" font-weight="700">MATCHED PASSAGE · P. 12</text><path d="M30 88h105" stroke="#cbd5e1" stroke-opacity=".42" stroke-width="4" stroke-linecap="round"/><rect x="18" y="111" width="149" height="42" rx="10" fill="#0b1020" fill-opacity=".6" stroke="#fff" stroke-opacity=".08"/><text x="30" y="129" fill="#a5b4fc" font-size="9" font-weight="700">MATCHED PASSAGE · P. 27</text><path d="M30 141h90" stroke="#cbd5e1" stroke-opacity=".42" stroke-width="4" stroke-linecap="round"/><text x="18" y="178" fill="#aab4c7" font-size="10">FAISS · MMR SEARCH</text></g><g transform="translate(603 122)"><rect width="190" height="112" rx="18" fill="#142a2c" stroke="#5eead4" stroke-opacity=".52"/><circle cx="26" cy="27" r="10" fill="#5eead4" fill-opacity=".16"/><path d="M22 27h8M26 23v8" stroke="#5eead4" stroke-width="1.8"/><text x="45" y="31" fill="#99f6e4" font-size="11" font-weight="700">GROUNDED ANSWER</text><path d="M20 55h146M20 70h128M20 85h99" stroke="#d1fae5" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="84" r="3" fill="#5eead4"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></circle></g><circle r="4" fill="#fff" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M260 150C320 94 360 80 405 114"/></circle></g></g></svg>
